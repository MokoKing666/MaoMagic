name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # 算法内核单测
  #
  # 这是 CI 的必过关卡。四个模块是纯 JVM（零 Android 依赖），
  # 因此不依赖 Android SDK Platform —— 即使托管 runner 尚未收录
  # platforms;android-37，这个 job 也必定能跑通。
  # ─────────────────────────────────────────────────────────────
  algorithm-tests:
    name: 算法内核单测（纯 JVM）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 跑算法内核单测
        run: >
          ./gradlew
          :core:model:test
          :core:calendar:test
          :core:hexagram:test
          :core:interpret:test
          --stacktrace

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────
  # 构建 Debug APK
  #
  # continue-on-error: true —— 托管 runner 可能尚未提供
  # platforms;android-37 / build-tools;36.0.0，此 job 失败不应
  # 阻塞 PR 合并。必过的关卡是上面的 algorithm-tests。
  # ─────────────────────────────────────────────────────────────
  assemble-debug:
    name: 构建 Debug APK
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装所需 SDK 组件
        continue-on-error: true
        run: |
          sdkmanager "platforms;android-37" "build-tools;36.0.0" || true
          sdkmanager --list_installed || true

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 构建 Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: 上传 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: maoxianhuanshu-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
