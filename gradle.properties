org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# R8 full mode。
#
# AGP 8.0 起默认就是 true，AGP 9.4.1 无需显式声明。
# 这里写出来是为了**明确意图** —— 免得将来有人以为是关的，
# 或者 AGP 升级时默认值变了却没人注意。
#
# full mode 比 compatibility mode 更激进：
# 假设「没有规则保护的反射都不存在」，所以反射/序列化必须靠规则显式保留。
# 本项目的 kotlinx.serialization 与 Compose 都有官方 consumer rules，
# proguard-rules.pro 里也保留了模型类。
android.enableR8.fullMode=true
